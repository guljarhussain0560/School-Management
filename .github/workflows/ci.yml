name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Linting & Static Analysis
  # ============================================================================
  lint:
    name: Code Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  # ============================================================================
  # Strict TypeScript Typechecking (Enforced Gating)
  # ============================================================================
  typecheck:
    name: Type Checking
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Strict TypeScript Check
        run: npm run typecheck

  # ============================================================================
  # Automated Tests & Coverage
  # ============================================================================
  test:
    name: Automated Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Enforced Test Coverage Suite
        run: npm run test:coverage

  # ============================================================================
  # Security Audit
  # ============================================================================
  security:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Security Audit
        run: npm audit --audit-level=high
        continue-on-error: true

  # ============================================================================
  # Production Application Build
  # ============================================================================
  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build Next.js Application
        run: npm run build
        env:
          NEXTAUTH_SECRET: 'ci-build-test-secret-key-32chars-minimum'
          NEXTAUTH_URL: 'http://localhost:3000'
          DATABASE_URL: 'postgresql://mock:mock@localhost:5432/mock_school_db'

  # ============================================================================
  # End-to-End Fresh-Clone Container Bootstrap Verification
  # ============================================================================
  e2e-bootstrap:
    name: E2E Bootstrap & Health Verification
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure Environment
        run: cp .env.example .env

      - name: Start Application Stack via Docker Compose
        run: docker compose up --build -d

      - name: Verify Health Endpoint Response
        run: |
          echo "Waiting for services to become healthy..."
          for i in {1..30}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/health || true)
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed with HTTP 200!"
              curl -s http://localhost:3000/api/health | jq .
              exit 0
            fi
            echo "Attempt $i: Received HTTP $STATUS, retrying in 3s..."
            sleep 3
          done
          echo "Health check timed out."
          docker compose logs app
          exit 1

      - name: Teardown Stack
        if: always()
        run: docker compose down -v

